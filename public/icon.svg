<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F2A900" />
      <stop offset="70%" stop-color="#D48800" />
      <stop offset="100%" stop-color="#8C5800" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F2A900" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A900" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3A2C0D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F2A900" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="245" r="140" fill="#F2A900" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Hex Shield Accent -->
  <polygon points="256,64 394,142 394,302 256,380 118,302 118,142" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Candlestick Graphic Accents -->
  <!-- Left Bullish Candle -->
  <line x1="168" y1="170" x2="168" y2="290" stroke="#00E676" stroke-width="2.5" stroke-opacity="0.4" />
  <rect x="162" y="195" width="12" height="55" rx="3" fill="#00E676" fill-opacity="0.35" />

  <!-- Right Bullish Candle -->
  <line x1="344" y1="150" x2="344" y2="270" stroke="#F2A900" stroke-width="2.5" stroke-opacity="0.4" />
  <rect x="338" y="170" width="12" height="60" rx="3" fill="#F2A900" fill-opacity="0.35" />

  <!-- Crown / Pinnacle Peak Above Logo -->
  <path d="M216,155 L256,122 L296,155 L280,165 L256,145 L232,165 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Stylized ASJADFX Monogram "A" -->
  <g filter="url(#glow)">
    <!-- Main Apex Outer Arch -->
    <path d="M256,150 L340,325 L298,325 L276,278 L236,278 L214,325 L172,325 Z M256,232 L243,260 L269,260 Z" fill="url(#goldGrad)" />
    
    <!-- Sharp Modern Diagonal Wings -->
    <path d="M256,150 L274,185 L238,185 Z" fill="url(#goldLight)" />
    
    <!-- Central Power Lightning/Ascent Line -->
    <polygon points="256,192 264,242 248,242" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Sleek Brand Typography Below -->
  <text x="256" y="388" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="9" fill="url(#goldGrad)" text-anchor="middle">ASJADFX</text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#8E9CB2" text-anchor="middle">TRADE • EARN • RISE</text>
</svg>
