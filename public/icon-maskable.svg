<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F2A900" />
      <stop offset="70%" stop-color="#D48800" />
      <stop offset="100%" stop-color="#8C5800" />
    </linearGradient>
    <linearGradient id="borderGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A900" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F2A900" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradM)" />
  
  <!-- Safe Zone Elements (Centered inside 80% circle) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Shield Accent -->
    <polygon points="256,64 394,142 394,302 256,380 118,302 118,142" fill="none" stroke="url(#borderGradM)" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Ambient Glow -->
    <circle cx="256" cy="245" r="130" fill="#F2A900" fill-opacity="0.14" filter="url(#glowM)" />

    <!-- Crown -->
    <path d="M216,155 L256,122 L296,155 L280,165 L256,145 L232,165 Z" fill="url(#goldGradM)" filter="url(#glowM)" />

    <!-- Stylized Monogram A -->
    <g filter="url(#glowM)">
      <path d="M256,150 L340,325 L298,325 L276,278 L236,278 L214,325 L172,325 Z M256,232 L243,260 L269,260 Z" fill="url(#goldGradM)" />
    </g>

    <!-- Typography -->
    <text x="256" y="388" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="9" fill="url(#goldGradM)" text-anchor="middle">ASJADFX</text>
    <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="6" fill="#8E9CB2" text-anchor="middle">TRADE • EARN • RISE</text>
  </g>
</svg>
